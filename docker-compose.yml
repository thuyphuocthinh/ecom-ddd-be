version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecom_postgres
    # The application opens up to 100 connections per copy (DATABASE_POOL_MAX); the default limit of 100
    # would be used up by one copy. A connection pooler (PgBouncer) is the way to lift this later.
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: ecom_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    # Append-only file: the token versions, revoked-session flags and used-up codes live here and
    # must survive a restart (the default snapshots can lose the last few minutes)
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: ecom_rabbitmq
    # RabbitMQ keeps its data under a folder named after the node, and the node is named after the
    # host name. Without a fixed one, a re-created container gets a new random name and starts with
    # an EMPTY broker, leaving the queues and messages in the volume unused.
    hostname: ecom-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
